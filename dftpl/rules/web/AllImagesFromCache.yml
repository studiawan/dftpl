title: Cached Images
id: 8e947e1a-313f-4c8f-bf3a-b0fd181ce879
status: experimental
description:  Find all images cached in the timeline
references: 
tags:
  - 
author: Java Kanaya Prada
date: 2025/02/07
modified: 2025/02/07
logsource:
  parser: sqlite/firefox_history
detection:
  keywords:
    - "WEBHIST"
    - "https"
    - "Content-Type: image/"
  condition: keywords
fields:
falsepositives:
level: informational
category: Web
high_level_event:
  type: Image Cached
  description: Image cached {keys[Filename]}
  keys:
    - name: Path
      source_type: attribute
      source_name: each_low_event.path
    - name: Content-Type
      source_type: utils
      source_name: get_content_type_from_request
      source_args:
        - each_low_event.evidence 
    - name: URL
      source_type: utils
      source_name: get_url_from_request
      source_args:
        - each_low_event.evidence 
    - name: Filename 
      source_type: utils
      source_name: get_filename_from_url
      source_args:
        - each_low_event.plugin 
reasoning:
  description: Content type of {keys[Filename]} found in 



