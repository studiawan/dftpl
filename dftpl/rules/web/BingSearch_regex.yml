title: Bing searches based on URL structure
id: 18bc41a9-c18c-4c26-8e2e-786e40ac96a8
status: experimental
description: Bing Search
references: 
tags:
  - 
author: Jony Patterson, Hudan Studiawan, Java Kanaya Prada
date: 2024/10/14
modified: 2024/10/14
logsource:
  parser: sqlite/firefox_history
detection:
  keywords:
    '|all|re':
      - 'WEBHIST'
      - 'https?:\/\/'  # Match http or https
      - 'www\.bing\.com\/search\?.*q='  # Bing search URL pattern
  condition: keywords
fields:
falsepositives:
level: informational
category: Web
high_level_event:
  type: Bing Search
  description: Bing Search for {keys[Search_Term]}
  keys:
    - name: Browser 
      source_type: utils
      source_name: get_browser
      source_args:
        - each_low_event.plugin 
    - name: Path
      source_type: attribute
      source_name: each_low_event.path
    - name: Search_Term
      source_type: utils
      source_name: get_query_params_from_url_where_key_is
      source_args:
        - each_low_event.evidence 
        - '"q"'
reasoning:
  description: Bing search URL found in {evidence}