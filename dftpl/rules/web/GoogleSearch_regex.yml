title: Google searches based on URL structure
id: f6935d71-bb4d-4918-8877-0afd9208b5b4
status: experimental
description: Google Search
references: 
  - https://bitbucket.org/chrishargreaves/pydft-analysers/src/master/Analysers/Web/GoogleSearch.py
  - https://serpapi.com/blog/google-search-parameters/
tags:
  - 
author: Jony Patterson, Hudan Studiawan, Java Kanaya Prada
date: 2024/06/29
modified: 2025/02/04
logsource:
  parser: sqlite/firefox_history
detection:
  keywords:
    '|all':
      - 'WEBHIST'
      - 'https?:\/\/'  # Match both http and https
      - 'www\.google\.(com|co\.[a-z]{2})'  # Match google.com or google.co.xx domains
      - '\/search\?.*q='  # Match search query parameter
  condition: 
fields:
falsepositives:
level: informational
category: Web
high_level_event:
  type: Google Search
  description: Google Search for {keys[Search_Term]}
  keys:
    - name: Browser 
      source_type: utils
      source_name: get_browser
      source_args:
        - each_low_event.plugin 
    - name: Path
      source_type: attribute
      source_name: each_low_event.path
    - name: Search_Term
      source_type: utils
      source_name: get_query_params_from_url_where_key_is
      source_args:
        - each_low_event.evidence 
        - '"q"'
reasoning:
  description: Google search URL found in {evidence}



