title: Bing searches based on URL structure
id: 8e947e1a-313f-4c8f-bf3a-b0fd181ce879
status: experimental
description: Bing Search
references: 
tags:
  - 
author: Jony Patterson, Hudan Studiawan, Java Kanaya Prada
date: 2024/10/14
modified: 2025/02/04
logsource:
  parser: sqlite/firefox_history
detection:
  keywords:
    - "WEBHIST"
    - "https"
    - "www"
    - "bing.com/search?q="
  condition: keywords
fields:
falsepositives:
level: informational
category: Web
high_level_event:
  type: Bing Search
  description: Bing Search for {keys[Search_Term]}
  keys:
    - name: Browser 
      source_type: utils
      source_name: get_browser
      source_args:
        - each_low_event.plugin 
    - name: Path
      source_type: attribute
      source_name: each_low_event.path
    - name: Search_Term
      source_type: utils
      source_name: get_query_params_from_url_where_key_is
      source_args:
        - each_low_event.evidence 
        - '"q"'
reasoning:
  description: Bing search URL found in {keys[Path]}



