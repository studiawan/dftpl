# Rule 6: Suspicious Network Connection
title: Suspicious Outbound Connection
id: NETWORK-CONN-001
description: Detects suspicious outbound network connections to unusual ports or destinations
category: Command and Control
status: stable
author: Java Kanaya Prada
date: 2025/03/15
tags:
  - attack.command_and_control
  - attack.t1071
detection:
  keywords:
    '|re':
      - "connect.*port (?:4444|8080|8888|9001|31337)"
      - "established tcp connection to.*:[0-9]+"
      - "outbound connection"
  condition: keywords
high_level_event:
  type: Suspicious Connection
  description: "Suspicious outbound connection from {keys[source_ip]}:{keys[source_port]} to {keys[destination_ip]}:{keys[destination_port]}"
  keys:
    - name: source_ip
      source_type: utils
      source_name: extract_source_ip_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: source_port
      source_type: utils
      source_name: extract_source_port_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: destination_ip
      source_type: utils
      source_name: extract_destination_ip_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: destination_port
      source_type: utils
      source_name: extract_destination_port_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: process_name
      source_type: utils
      source_name: extract_process_name_from_evidence
      source_args:
        - "each_low_event.evidence"
reasoning:
  description: "Suspicious network connection detected from process {keys[process_name]} to destination {keys[destination_ip]}:{keys[destination_port]}"
  found_in: evidence

