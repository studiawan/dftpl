# Rule 8: Web Shell Detection
title: Web Shell Detection
id: WEBSHELL-001
description: Detects potential web shell activity in web server logs
category: Persistence
status: stable
author: Java Kanaya Prada 
date: 2025/03/15
tags:
  - attack.persistence
  - attack.t1505.003
detection:
  keywords:
    '|re':
      - "GET /.*\\.(php|jsp|asp|aspx)\\?(?:cmd|command|c|system|exec|shell|passthru)="
      - "POST /.*\\.(php|jsp|asp|aspx)"
      - "\\[error\\].*eval.*POST"
  condition: keywords
high_level_event:
  type: Web Shell Activity
  description: "Potential web shell activity detected: {keys[http_request]} from IP {keys[source_ip]}"
  keys:
    - name: http_request
      source_type: utils
      source_name: extract_http_request_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: source_ip
      source_type: utils
      source_name: extract_source_ip_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: http_method
      source_type: utils
      source_name: extract_http_method_from_evidence
      source_args:
        - "each_low_event.evidence" 
    - name: uri_path
      source_type: utils
      source_name: extract_uri_path_from_evidence
      source_args:
        - "each_low_event.evidence"
reasoning:
  description: "Web shell activity indicators detected in {keys[http_method]} request to {keys[uri_path]} from {keys[source_ip]}"
  found_in: evidence

