# Rule 9: Suspicious User Account Creation
title: Suspicious User Account Creation
id: 1181ca9e-38c5-4016-a491-97180292e74e
description: Detects creation of new user accounts that might indicate unauthorized access
category: Persistence
status: stable
author: Java Kanaya Prada
date: 2025/03/15
tags:
  - attack.persistence
  - attack.t1136
detection:
  keywords:
    '|re':
      - "useradd"
      - "new user"
      - "new account"
      - "added.*group"
  condition: keywords
high_level_event:
  type: User Account Creation
  description: "New user account {keys[new_username]} created by {keys[creator_username]}"
  keys:
    - name: new_username
      source_type: utils
      source_name: extract_new_username_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: creator_username
      source_type: utils
      source_name: extract_creator_username_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: groups
      source_type: utils
      source_name: extract_groups_from_evidence
      source_args:
        - "each_low_event.evidence"
reasoning:
  description: "New user account {keys[new_username]} was created by {keys[creator_username]} with groups: {keys[groups]}"
  found_in: evidence

