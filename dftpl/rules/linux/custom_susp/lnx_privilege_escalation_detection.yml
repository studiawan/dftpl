# Rule 2: Privilege Escalation Detection
title: Suspicious Privilege Escalation
id: PRIV-ESCALATION-001
description: Detects successful privilege escalation via sudo/su commands
category: Privilege Escalation
status: stable
author: Java Kanaya Prada
date: 2025/03/15
tags:
  - attack.privilege_escalation
  - attack.t1548
detection:
  keywords:
    '|re':
      - "session opened for user root by"
      - "COMMAND=/bin/bash"
      - "COMMAND=/bin/sh"
      - "COMMAND=.*chmod.*[0-7][0-7][0-7][0-7]"
      - "COMMAND=.*chown.*root"
  condition: keywords
high_level_event:
  type: Privilege Escalation
  description: "User {keys[source_user]} escalated privileges using {keys[command]}"
  keys:
    - name: source_user
      source_type: utils
      source_name: extract_source_user_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: target_user
      source_type: utils
      source_name: extract_target_user_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: command
      source_type: utils
      source_name: extract_command_from_evidence
      source_args:
        - "each_low_event.evidence"
reasoning:
  description: "Suspicious privilege escalation detected where {keys[source_user]} elevated to {keys[target_user]} using command: {keys[command]}"
  found_in: evidence

