# Rule 1: Detect SSH Brute Force Attempts
title: SSH Brute Force Attack Detection
id: SSH-BRUTE-FORCE-001
description: Detects multiple failed SSH authentication attempts indicating a possible brute force attack
category: Credential Access
status: stable
author: Java Kanaya Prada
date: 2025/03/15
tags:
  - attack.credential_access
  - attack.t1110
detection:
  keywords:
    '|re':
      - "Failed password for .* from [0-9.]+ port [0-9]+"
      - "authentication failure.*rhost="
      - "Failed publickey for .* from [0-9.]+ port [0-9]+"
  condition: keywords
high_level_event:
  type: Credential Attack
  description: "Potential SSH brute force attack detected from source IP: {keys[source_ip]}"
  keys:
    - name: event_count
      source_type: attribute
      source_name: id
    - name: source_ip
      source_type: utils
      source_name: extract_ip_from_evidence
      source_args:
        - "each_low_event.evidence"
    - name: target_user
      source_type: utils
      source_name: extract_username_from_evidence
      source_args:
        - "each_low_event.evidence"
reasoning:
  description: "Multiple failed SSH authentication attempts detected from IP {keys[source_ip]} targeting user {keys[target_user]}"
  found_in: evidence

